<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8" />
    <title>Noodle Gallery</title>
    <!-- Prism CSS for styling -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/themes/prism-tomorrow.min.css" rel="stylesheet" />

    <!-- Prism JS core -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
</head>
<style>
    pre, h4 {
        color: rgb(135, 125, 125);
    }
</style>
<body style="background-color: #1e1e1e;">
    <a style="color: whitesmoke" href="portfolio.html"><h3>BACK</h3></a>
    <pre> 
Hello!
This is the gallery for my language noodle. These are example projects created by me, or others when someone *finally* uses my language
     </pre>
    <h4>The Classic: Hello World Program</h4>
    <pre class="language-noodle" id="helloworld"> 
    </pre>
    <h4>YearDiff</h4>
    <pre class="language-noodle" id="yeardiff"> 
    </pre>
    <h4>Powerof</h4>
    <pre class="language-noodle" id="powerof"> 
    </pre>
    <h4>Calculator</h4>
    <pre class="language-noodle" id="calc"> 
    </pre>
    <h4>Snake</h4>
    <pre class="language-noodle" id="snake">  
    </pre>

    <script>
    // Define a simple Noodle language
    Prism.languages.noodle = {
    'comment': /#\([^\)]*\)/, // Matches !( ... ) style comments
    'keyword': /\b(writeLn|number|string|boolean|mut|if|else|loop|fn|output|template|prop|foreach)\b/,
    'builtin': /\b(<[A-Z_]+#\([^)]*\)>|<INIT_WINDOW#\([^)]*\)>|<CLOSE_WINDOW#\(\)>)\b/,
    'number': /\b\d+\b/,
    'string': /"[^"]*"/
    };
    </script>

    <script>
        document.getElementById('helloworld').textContent += 'writeLn("Hello, World!")'
        Prism.highlightElement(document.getElementById('helloworld'));
        document.getElementById('yeardiff').textContent += `
#(
    Little program that takes in a year and gets the
    difference from that year and the current year
)

number cur is <DATE!("year")>

string target_ is query("Enter year: ")
number target is <CNV!(<target_>)>

if(<target> >= <cur>) {
    writeLn(<target> - <cur>)
} else {
    writeLn(<cur> - <target>)
}
        `
        Prism.highlightElement(document.getElementById('yeardiff'));
        document.getElementById('powerof').textContent += `
persistant fn topower(x, exponent) {
    mut number x_new is x
    loop <exponent> {
        x_new = x_new * x_new
    }
    output(x_new)
}

writeLn(<topower(2, 2)>)
        `
        Prism.highlightElement(document.getElementById('powerof'));
        document.getElementById('calc').textContent += `
#(
    Basic Program Where [user] enters one value
    and another and it adds them together
)



string string_i1 is query("Enter N1: ")
number i1 is <CNV!(<string_i1>)>

string string_i2 is query("Enter N2: ")
number i2 is <CNV!(<string_i2>)>

writeLn(<i1> + <i2>)
                                                        `
    Prism.highlightElement(document.getElementById('calc'));
    document.getElementById('snake').textContent += `
#(
    Snake, Remember to put "graphics" and "math" in ndconf.json
)

<INIT_WINDOW!(400, 400, "snake")>

template segment {
    prop x is number,
    prop y is number,
}

mut array snake is [segment {
    x: 0,
    y: 0,
}]
number TILE_SIZE is 20

mut number player_x is 0
mut string dir is "down"
mut string next_dir is "down"
mut number player_y is 0

mut boolean alive is true
mut boolean not_eaten is true

mut number apple_x is 5000
mut number apple_y is 5000
mut number move_timer is 0
mut number sec_per_frame is 1 / 2


fn spawn_apple() {
    apple_x is <MATH!("round", <MATH!("trunc", <TILE_SIZE> * <RAND!()>)>)>
    apple_y is <MATH!("round", <MATH!("trunc", <TILE_SIZE> * <RAND!()>)>)>
}

<spawn_apple()>
while(!<WINDOW_SHOULD_CLOSE!()>) {
    <BEGIN_DRAWING!()>

    if(<IS_KEY_DOWN!("LEFT")> && !(<dir> == "right")) {
        next_dir is "left"
    }
    if(<IS_KEY_DOWN!("RIGHT")> && !(<dir> == "left")) {
        next_dir is "right"
    }
    if(<IS_KEY_DOWN!("UP")> && !(<dir> == "down")) {
        next_dir is "up"
    }
    if(<IS_KEY_DOWN!("DOWN")> && !(<dir> == "up")) {
        next_dir is "down"
    }

    move_timer is <move_timer> + <DELTA!()>

    mut number new_x is <player_x>
    mut number new_y is <player_y>

    #( TODO: fix)


    if(<alive> && <move_timer> >= <sec_per_frame>) {
        dir is <next_dir>
        not_eaten is true

        if(<dir> == "left") {
            new_x is <new_x> - 1
        }
        if(<dir> == "right") {
            new_x is <new_x> + 1
        }
        if(<dir> == "up") {
            new_y is <new_y> - 1
        }    
        if(<dir> == "down") {
            new_y is <new_y> + 1
        }

        if(<new_y> > 20) {
            new_y is 0
        }
        if(<new_x> > 20) {
            new_x is 0
        }
        if(<new_y> < 0) {
            new_y is 20
        }
        if(<new_x> < 0) {
            new_x is 20
        }

        foreach (<snake>, i) {
            object snake_segment is <snake at <i>>
            #( fix issue with ArrayAccess later )

            if(<snake_segment.x> == <new_x> && <snake_segment.y> == <new_y>) {
                alive is false
            }
        }

        if(<new_x> == <apple_x> && <new_y> == <apple_y>) {
            not_eaten is false
            <spawn_apple()>
        }

        push(snake, segment {
            x: <player_x>,
            y: <player_y>,
        })
        
        if(<snake.length> >= 5 && <not_eaten>) {
            pop(snake)
        }

        player_x is <new_x>
        player_y is <new_y>
        move_timer is 0
    } 
    <CLEAR_BACKGROUND!(0, 0, 0)>
    <RECTANGLE!(<apple_x> * <TILE_SIZE>, <apple_y> * <TILE_SIZE>, <TILE_SIZE>, <TILE_SIZE>, 255, 0, 0, 255)>

    foreach (<snake>, i) {
        object snake_segment is <snake at <i>>
        #( fix issue with ArrayAccess later )

        if(<snake_segment.x> == <new_x> && <snake_segment.y> == <new_y>) {
            alive is false
        }
        
        <RECTANGLE!(<snake_segment.x> * <TILE_SIZE>, <snake_segment.y> * <TILE_SIZE>, <TILE_SIZE>, <TILE_SIZE>, 0, 255, 0, 255)>
    }

    <TEXT!("X: " + <player_x>, 0, 0, 20, 255, 255, 255, 255)>
    <TEXT!("Y: " + <player_y>, 0, 20, 20, 255, 255, 255, 255)>
    <TEXT!("LEN: " + <snake.length>, 0, 40, 20, 255, 255, 255, 255)>

    if(!<alive>) {
        dir is "dead lmao"
        <TEXT!("GAME OVER", 80, 180, 40, 255, 255, 255, 255)>
        <TEXT!(":(", 80, 220, 20, 255, 255, 255, 255)>
    }
    <STOP_DRAWING!()>
}

<CLOSE_WINDOW!()>
    `
    Prism.highlightElement(document.getElementById('snake'));

    </script>
</body>
</html>
